name: Sync Substack posts

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch posts and report the plan without writing files or opening a PR.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: substack-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync Substack posts
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python3 scripts/sync_substack.py $DRY_RUN

      - name: Detect new bundles
        id: changes
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -n "$(git status --porcelain -- content/english/blog)" ]; then
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Hugo Extended
        if: steps.changes.outputs.created == 'true'
        uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3
        with:
          hugo-version: "0.149.0"
          extended: true

      - name: Install dependencies
        if: steps.changes.outputs.created == 'true'
        run: npm ci

      - name: Build site
        if: steps.changes.outputs.created == 'true'
        env:
          HUGO_ENV: production
        run: npm run build

      - name: Open pull request
        if: steps.changes.outputs.created == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ github.token }}
          branch: automated/substack-sync
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          add-paths: content/english/blog/
          commit-message: Sync Substack posts
          title: Sync Substack posts
          body: |
            Adds redirect bundles for Substack posts that are not yet listed on the blog.

            Existing blog content is never modified or deleted. This pull request was created with `GITHUB_TOKEN`, so GitHub does not trigger other workflows from it.
