# Pull new trustial.substack.com posts into content/english/blog as redirect
# stubs, then open or update a draft pull request. This workflow never merges
# and never marks that pull request ready for review.
#
# Pull requests and branch pushes created with the default GITHUB_TOKEN do not
# trigger other workflows. .github/workflows/deploy.yml runs only after a person
# merges the sync pull request into the default branch.
name: Sync Substack posts

on:
  schedule:
    # 15:17 UTC every day. GitHub may delay scheduled runs.
    - cron: "17 15 * * *"
  workflow_dispatch:

defaults:
  run:
    shell: bash

# The job below opts into the two scopes it needs. Nothing else inherits
# a write token.
permissions: {}

concurrency:
  group: substack-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync posts and open a draft pull request
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the substack-sync branch
      pull-requests: write # open or update the draft pull request
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Sync Substack posts
        run: python3 scripts/sync_substack.py

      - name: Detect content changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- content/english/blog)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Hugo Extended
        if: steps.changes.outputs.changed == 'true'
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f # v3.0.0
        with:
          hugo-version: "0.149.0"
          extended: true

      - name: Install npm dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Build site
        if: steps.changes.outputs.changed == 'true'
        env:
          HUGO_ENV: production
        run: npm run build

      - name: Open or update draft pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ github.token }}
          branch: substack-sync
          base: ${{ github.event.repository.default_branch }}
          draft: "true"
          delete-branch: true
          add-paths: content/english/blog/
          commit-message: |
            Sync Substack posts

            Add redirect stubs for new trustial.substack.com posts.
          title: Sync Substack posts
          body: |
            Syncs new posts from the public feed at <https://trustial.substack.com/feed> into `content/english/blog/` as redirect stubs.

            Each new bundle follows the existing external-post pattern: `external_url` and `canonical` point at the Substack post, `noindex: true`, and the featured image is saved in the bundle when the feed provides one. Posts already linked by `external_url` or `canonical` are left untouched. Hand-written posts are never modified or deleted.

            This pull request is opened as a draft with the default `GITHUB_TOKEN`. GitHub does not run other workflows for events triggered by that token, so checks and the Pages deploy do not run on this branch or on this pull request. Review the new bundles, mark the pull request ready, and merge it to publish. Later runs of this workflow update the same open pull request and do not mark it ready.

            To drop a bad batch, close this pull request without merging. To stop the automation, delete `.github/workflows/sync-substack.yml`.
